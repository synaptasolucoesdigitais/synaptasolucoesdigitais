<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Fundo -->
  <rect width="500" height="500" rx="100" fill="#1A3A5C"/>

  <!-- Rede sináptica em percurso S -->
  <g fill="none" stroke="#E8A33D" stroke-width="26"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Topo: direita → esquerda, descendo -->
    <path d="M 370 140 C 260 140, 240 220, 140 220"/>

    <!-- Meio: esquerda → direita, descendo -->
    <path d="M 140 220 C 240 220, 260 300, 370 300"/>

    <!-- Base: direita → esquerda, descendo -->
    <path d="M 370 300 C 260 300, 240 380, 140 380"/>
  </g>

  <!-- Nós nas extremidades -->
  <circle cx="370" cy="140" r="22" fill="#E8A33D"/>
  <circle cx="140" cy="220" r="22" fill="#E8A33D"/>
  <circle cx="370" cy="300" r="22" fill="#E8A33D"/>
  <circle cx="140" cy="380" r="22" fill="#E8A33D"/>
</svg>